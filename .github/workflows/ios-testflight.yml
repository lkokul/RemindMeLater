name: iOS TestFlight

# Disparo solo manual (workflow_dispatch), igual que "npm run dist" de
# Electron es manual hoy -- una vez este archivo existe en la rama por
# defecto, el dialogo "Run workflow" de la pestaña Actions ya trae un
# desplegable nativo para elegir CUALQUIER rama, sin necesitar nada mas
# aqui para poder compilar builds de prueba desde otras ramas.
#
# El input "descripcion" es opcional y solo cambia el NOMBRE con el que
# el run aparece en la lista de Actions (run-name), para distinguir a
# simple vista que se estaba compilando ("rediseno gimnasio fase 7"...)
# en vez de un "iOS TestFlight #12" generico. OJO: el dialogo de Run
# workflow lee los inputs del archivo de la RAMA elegida en el
# desplegable, asi que este campo solo aparece al lanzar desde ramas
# que ya llevan esta version del archivo.
run-name: ${{ inputs.descripcion || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      descripcion:
        description: 'Nombre descriptivo para este build (opcional)'
        required: false
        type: string

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar public/ con el proyecto iOS
        run: npx cap sync ios

      - name: Escribir la clave de API de App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Archivar la app (xcodebuild archive)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Se archiva SIN FIRMAR a proposito, y la firma se hace entera
          # en el paso de exportar. Motivo: la firma automatica de Xcode,
          # al archivar, siempre pide un perfil de DESARROLLO -- y Apple
          # se niega a crear uno si el equipo no tiene ningun dispositivo
          # registrado ("Your team has no devices..."), que es justo el
          # caso de un pipeline sin Mac ni iPhone conectado. Imponerle la
          # identidad de distribucion tampoco vale: con estilo automatico
          # Xcode la rechaza ("conflicting provisioning settings"). En
          # cambio el perfil de App Store que pide -exportArchive SI se
          # crea sin dispositivos, asi que ahi es donde se firma.
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      # La Live Activity solo funciona si la extension DescansoWidget viaja
      # DENTRO de la app (App.app/PlugIns/DescansoWidget.appex). Este paso
      # lo comprueba y tira el build si falta -- sin el, un fallo de
      # embedding pasa en silencio y la tarjeta simplemente "no sale" en el
      # movil, sin ninguna pista de por que.
      - name: Comprobar que el widget va dentro de la app
        run: |
          PLUGINS="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/PlugIns"
          echo "Contenido de PlugIns:"
          ls -la "$PLUGINS" || true
          test -d "$PLUGINS/DescansoWidget.appex"

      - name: Generar ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          EOF

      - name: Exportar el .ipa (xcodebuild -exportArchive)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      # COMPROBAR LOS ENTITLEMENTS DEL .ipa YA FIRMADO.
      #
      # Por que hace falta: se archiva SIN FIRMAR (CODE_SIGNING_ALLOWED=NO,
      # ver el comentario del paso de archivar) y los entitlements se
      # incrustan AL FIRMAR. Si el App Group no sobrevive a ese camino, no
      # hay ningun error: la build sale verde, la app se instala, y
      # UserDefaults(suiteName:) devuelve nil en el movil -- el widget se
      # queda con "Abre la app" para siempre. Paso de verdad con la #51.
      #
      # Esto lo convierte en un fallo RUIDOSO: se imprimen los entitlements
      # reales de la app y de la extension, y si al widget le falta el
      # grupo se tira la build antes de subir nada a TestFlight.
      - name: Comprobar que el App Group viajo en la firma
        run: |
          cd "$RUNNER_TEMP/export"
          unzip -q App.ipa -d ipa
          APP="ipa/Payload/App.app"
          APPEX="$APP/PlugIns/DescansoWidget.appex"

          echo "==== Entitlements de la APP ===="
          codesign -d --entitlements :- "$APP" 2>/dev/null || true
          echo "==== Entitlements del WIDGET ===="
          codesign -d --entitlements :- "$APPEX" 2>/dev/null || true

          falta=0
          for objetivo in "$APP" "$APPEX"; do
            if codesign -d --entitlements :- "$objetivo" 2>/dev/null | grep -q "group.com.koku.remindmelater"; then
              echo "OK: $objetivo lleva el App Group"
            else
              echo "FALTA el App Group en $objetivo"
              falta=1
            fi
          done

          if [ "$falta" = "1" ]; then
            echo ""
            echo "El App Group NO ha sobrevivido a la firma."
            echo "Sin el, la app y el widget no comparten buzon y el widget"
            echo "se queda en blanco. Ver ANDROID-PENDIENTE.md no; ver el"
            echo "bloque de Widgets en CLAUDE.md."
            exit 1
          fi

      # Subida con xcrun altool directamente, sin accion de terceros: usa
      # el MISMO mecanismo de autenticacion (clave de API en
      # ~/private_keys/AuthKey_<KEYID>.p8, donde altool la busca sola) que
      # ya funciona en los pasos de archivar y exportar de arriba. La
      # accion apple-actions/upload-testflight-build@v1 fallaba con un 401
      # porque su parametro de issuer se llama "issuer-id", no
      # "api-issuer-id" -- se le estaba pasando vacio.
      - name: Subir a TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/App.ipa" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
